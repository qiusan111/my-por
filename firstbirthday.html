<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>生日快乐！🎉</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 星空canvas -->
  <canvas id="stars"></canvas>

  <!-- 烟花canvas -->
  <canvas id="fireworks"></canvas>

  <h1>🎉 生日快乐！Happy Birthday! 🎂</h1>
  <div class="typing" id="typing-text"></div>

  <!-- 飘动气球由 script.js 动态生成 -->

  <!-- 两侧玫瑰花 -->
  <img src="https://img.icons8.com/emoji/96/rose.png" class="rose left" />
  <img src="https://img.icons8.com/emoji/96/rose.png" class="rose right" />

  <!-- 背景音乐 -->
  <audio autoplay loop>
    <source src="https://cdn.pixabay.com/audio/2021/11/17/audio_97ba1dfc6d.mp3" type="audio/mpeg">
    您的浏览器不支持音频播放。
  </audio>

  <!-- 脚本 -->
  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta
    name="description"
    content="3D Gesture Controlled Birthday Party"
>

<title>Birthday Party</title>


<!-- =========================================================
     THREE.JS
     ========================================================= -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>


<!-- =========================================================
     MEDIAPIPE
     ========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>


<style>

/* =========================================================
   RESET
   ========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {

    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 45%,
            #24083d 0%,
            #0c031b 42%,
            #020106 100%
        );

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


/* =========================================================
   THREE CONTAINER
   ========================================================= */

#sceneContainer {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 1;

}

#sceneContainer canvas {

    display: block;

}


/* =========================================================
   LOADING SCREEN
   ========================================================= */

#loadingScreen {

    position: fixed;

    inset: 0;

    z-index: 200;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    background:
        radial-gradient(
            circle at center,
            #2b0b49 0%,
            #0c0319 48%,
            #010105 100%
        );

    transition:
        opacity 1s ease;

}

.loadingGlow {

    position: absolute;

    width: 420px;
    height: 420px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255, 70, 190, .20),
            transparent 68%
        );

    filter: blur(8px);

    animation:
        loadingGlow 2.4s ease-in-out infinite alternate;

}

@keyframes loadingGlow {

    from {
        transform: scale(.8);
        opacity: .55;
    }

    to {
        transform: scale(1.2);
        opacity: 1;
    }

}


/* =========================================================
   GIFT
   ========================================================= */

.loadingGift {

    position: relative;

    width: 160px;
    height: 140px;

    margin-bottom: 28px;

    z-index: 2;

    animation:
        giftFloat 2s ease-in-out infinite;

}

@keyframes giftFloat {

    0%,
    100% {
        transform:
            translateY(0)
            rotate(-2deg);
    }

    50% {
        transform:
            translateY(-14px)
            rotate(2deg);
    }

}

.giftBox {

    position: absolute;

    left: 20px;
    bottom: 0;

    width: 120px;
    height: 85px;

    border-radius: 8px;

    background:
        linear-gradient(
            135deg,
            #ff57b0,
            #c91672
        );

    box-shadow:
        0 12px 35px
        rgba(255, 0, 150, .45);

}

.giftRibbonVertical {

    position: absolute;

    left: 50%;

    transform:
        translateX(-50%);

    width: 21px;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            #ffd84c,
            #fff1a0,
            #ffb800
        );

}

.giftLid {

    position: absolute;

    left: 10px;
    bottom: 76px;

    width: 140px;
    height: 27px;

    border-radius: 7px;

    background:
        linear-gradient(
            135deg,
            #ff76bd,
            #df1b7d
        );

}

.giftRibbonHorizontal {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 8px;

    background:
        #ffd84c;

}

.giftBow {

    position: absolute;

    left: 50%;
    bottom: 91px;

    width: 90px;
    height: 48px;

    transform:
        translateX(-50%);

}

.bowLeft,
.bowRight {

    position: absolute;

    top: 5px;

    width: 45px;
    height: 32px;

    border-radius:
        70% 30% 70% 30%;

    background:
        linear-gradient(
            135deg,
            #ffe45b,
            #ffae00
        );

}

.bowLeft {
    left: 0;
    transform: rotate(-25deg);
}

.bowRight {
    right: 0;
    transform:
        scaleX(-1)
        rotate(-25deg);
}

.bowCenter {

    position: absolute;

    left: 50%;
    top: 12px;

    width: 21px;
    height: 21px;

    transform:
        translateX(-50%);

    border-radius: 50%;

    background: #fff19b;

    box-shadow:
        0 0 15px
        #fff19b;

}


/* =========================================================
   LOADING TEXT
   ========================================================= */

#loadingText {

    position: relative;

    z-index: 3;

    font-size:
        clamp(
            23px,
            5vw,
            44px
        );

    font-weight: 900;

    letter-spacing: 4px;

    text-align: center;

    text-shadow:
        0 0 8px white,
        0 0 20px #ff78d1,
        0 0 42px #ff209e,
        0 0 80px #9d4dff;

}

#loadingSubtitle {

    position: relative;

    z-index: 3;

    margin-top: 12px;

    font-size: 12px;

    letter-spacing: 3px;

    color:
        rgba(
            255,
            255,
            255,
            .62
        );

}

#loadingBar {

    position: relative;

    z-index: 3;

    width:
        min(
            340px,
            72vw
        );

    height: 7px;

    margin-top: 28px;

    overflow: hidden;

    border-radius: 99px;

    background:
        rgba(
            255,
            255,
            255,
            .12
        );

}

#loadingProgress {

    width: 0%;

    height: 100%;

    border-radius: inherit;

    background:
        linear-gradient(
            90deg,
            #ff3cae,
            #a45cff,
            #48dfff,
            #fff05a
        );

    box-shadow:
        0 0 20px #ff3cae;

    transition:
        width .3s ease;

}


/* =========================================================
   MAIN TITLE
   ========================================================= */

#mainTitle {

    position: fixed;

    left: 50%;
    top: 24px;

    z-index: 30;

    transform:
        translateX(-50%);

    font-size:
        clamp(
            27px,
            5vw,
            64px
        );

    font-weight: 900;

    letter-spacing: 5px;

    white-space: nowrap;

    text-align: center;

    text-shadow:
        0 0 8px white,
        0 0 20px #ff9ce0,
        0 0 40px #ff2da8,
        0 0 80px #9d45ff;

}


/* =========================================================
   PARTY TITLE
   ========================================================= */

#celebrateText {

    position: fixed;

    left: 50%;
    top: 104px;

    z-index: 30;

    transform:
        translateX(-50%);

    font-size:
        clamp(
            13px,
            2vw,
            23px
        );

    font-weight: 900;

    letter-spacing: 7px;

    white-space: nowrap;

    color:
        #ffd95b;

    text-shadow:
        0 0 8px #ffd95b,
        0 0 20px #ff9d00,
        0 0 40px #ff4a00;

    animation:
        partyPulse 1.4s ease-in-out infinite alternate;

}

@keyframes partyPulse {

    from {
        opacity: .72;
        transform:
            translateX(-50%)
            scale(1);
    }

    to {
        opacity: 1;
        transform:
            translateX(-50%)
            scale(1.08);
    }

}


/* =========================================================
   STATUS
   ========================================================= */

#gestureStatus {

    position: fixed;

    left: 20px;
    top: 20px;

    z-index: 50;

    padding:
        12px 18px;

    border-radius: 999px;

    background:
        rgba(
            8,
            3,
            22,
            .72
        );

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .15
        );

    backdrop-filter:
        blur(14px);

    font-size: 13px;

    letter-spacing: 1px;

}

#statusDot {

    display: inline-block;

    width: 9px;
    height: 9px;

    margin-right: 8px;

    border-radius: 50%;

    background:
        #ff3cae;

    box-shadow:
        0 0 14px #ff3cae;

}


/* =========================================================
   CAMERA
   ========================================================= */

#cameraPreview {

    position: fixed;

    right: 20px;
    bottom: 20px;

    z-index: 40;

    width: 240px;
    height: 180px;

    object-fit: cover;

    transform:
        scaleX(-1);

    border-radius: 18px;

    border:
        2px solid
        rgba(
            255,
            255,
            255,
            .25
        );

    background: #000;

    box-shadow:
        0 0 25px
        rgba(
            255,
            70,
            190,
            .28
        );

}

#handCanvas {

    position: fixed;

    right: 20px;
    bottom: 20px;

    z-index: 41;

    width: 240px;
    height: 180px;

    pointer-events: none;

}


/* =========================================================
   CONTROL PANEL
   ========================================================= */

#controlPanel {

    position: fixed;

    left: 20px;
    bottom: 20px;

    z-index: 50;

    width: 280px;

    padding: 17px;

    border-radius: 20px;

    background:
        rgba(
            7,
            3,
            20,
            .72
        );

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .13
        );

    backdrop-filter:
        blur(15px);

}

.panelTitle {

    margin-bottom: 11px;

    font-size: 13px;

    font-weight: 900;

    letter-spacing: 2px;

}

.controlRow {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    padding: 6px 0;

    font-size: 12px;

    color:
        rgba(
            255,
            255,
            255,
            .75
        );

}

.keyBadge {

    min-width: 32px;

    padding:
        5px 8px;

    text-align: center;

    border-radius: 6px;

    background:
        rgba(
            255,
            255,
            255,
            .1
        );

    font-weight: 900;

}


/* =========================================================
   BOTTOM MESSAGE
   ========================================================= */

#partyMessage {

    position: fixed;

    left: 50%;
    bottom: 25px;

    z-index: 30;

    transform:
        translateX(-50%);

    font-size:
        clamp(
            11px,
            1.5vw,
            17px
        );

    letter-spacing: 3px;

    white-space: nowrap;

    color:
        rgba(
            255,
            255,
            255,
            .8
        );

    text-shadow:
        0 0 15px #ff54ba;

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 700px) {

    #controlPanel {
        display: none;
    }

    #cameraPreview,
    #handCanvas {

        width: 145px;
        height: 109px;

        right: 10px;
        bottom: 10px;

    }

    #gestureStatus {

        left: 10px;
        top: 10px;

        font-size: 11px;

    }

    #mainTitle {
        top: 60px;
    }

    #celebrateText {

        top: 110px;

        letter-spacing: 3px;

    }

    #partyMessage {

        bottom: 12px;

        font-size: 10px;

        letter-spacing: 1px;

    }

}

</style>

</head>


<body>


<!-- =========================================================
     LOADING
     ========================================================= -->

<div id="loadingScreen">

    <div class="loadingGlow"></div>

    <div class="loadingGift">

        <div class="giftBow">

            <div class="bowLeft"></div>

            <div class="bowRight"></div>

            <div class="bowCenter"></div>

        </div>

        <div class="giftLid">

            <div class="giftRibbonHorizontal"></div>

        </div>

        <div class="giftBox">

            <div class="giftRibbonVertical"></div>

        </div>

    </div>

    <div id="loadingText">
        LOADING YOUR GIFT...
    </div>

    <div id="loadingSubtitle">
        GETTING THE CELEBRATION READY
    </div>

    <div id="loadingBar">

        <div id="loadingProgress"></div>

    </div>

</div>


<!-- =========================================================
     SCENE
     ========================================================= -->

<div id="sceneContainer"></div>


<!-- =========================================================
     CAMERA
     ========================================================= -->

<video
    id="cameraPreview"
    autoplay
    muted
    playsinline>
</video>


<canvas
    id="handCanvas"
    width="640"
    height="480">
</canvas>


<!-- =========================================================
     TITLES
     ========================================================= -->

<div id="mainTitle">
    HAPPY BIRTHDAY
</div>

<div id="celebrateText">
    ✨ CELEBRATE PARTY ✨
</div>


<!-- =========================================================
     STATUS
     ========================================================= -->

<div id="gestureStatus">

    <span id="statusDot"></span>

    <span id="statusText">
        Starting...
    </span>

</div>


<!-- =========================================================
     CONTROLS
     ========================================================= -->

<div id="controlPanel">

    <div class="panelTitle">
        GESTURE CONTROLS
    </div>

    <div class="controlRow">
        <span>🖐 Open Hand</span>
        <span class="keyBadge">1</span>
    </div>

    <div class="controlRow">
        <span>✊ Fist</span>
        <span class="keyBadge">2</span>
    </div>

    <div class="controlRow">
        <span>☝ Point</span>
        <span class="keyBadge">3</span>
    </div>

    <div class="controlRow">
        <span>✌ Peace</span>
        <span class="keyBadge">4</span>
    </div>

    <div class="controlRow">
        <span>👍 Like</span>
        <span class="keyBadge">5</span>
    </div>

</div>


<div id="partyMessage">
    TAP THE SCREEN ONCE TO START THE MUSIC
</div>


<script>

/* =========================================================
   CONFIG
   ========================================================= */

const CONFIG = {

    starCount: 1800,

    ambientParticleCount: 2200,

    fireworkInterval: 1700,

    maximumFireworks: 16,

    cameraWidth: 640,

    cameraHeight: 480,

    gestureCooldown: 1000

};


/* =========================================================
   STATE
   ========================================================= */

const state = {

    partyRunning: true,

    fireworksEnabled: true,

    candlesEnabled: true,

    musicEnabled: true,

    musicStarted: false,

    cameraReady: false,

    handsReady: false,

    currentGesture: "none",

    lastGestureTime: 0

};


/* =========================================================
   DOM
   ========================================================= */

const sceneContainer =
    document.getElementById(
        "sceneContainer"
    );

const cameraPreview =
    document.getElementById(
        "cameraPreview"
    );

const handCanvas =
    document.getElementById(
        "handCanvas"
    );

const handContext =
    handCanvas.getContext(
        "2d"
    );

const statusText =
    document.getElementById(
        "statusText"
    );

const loadingScreen =
    document.getElementById(
        "loadingScreen"
    );

const loadingProgress =
    document.getElementById(
        "loadingProgress"
    );

const partyMessage =
    document.getElementById(
        "partyMessage"
    );


/* =========================================================
   LOADING
   ========================================================= */

let loadingValue = 0;

function updateLoading(
    value
) {

    loadingValue =
        Math.max(
            loadingValue,
            value
        );

    loadingProgress.style.width =
        loadingValue + "%";

}


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(
    message
) {

    statusText.textContent =
        message;

}


/* =========================================================
   THREE VARIABLES
   ========================================================= */

let scene;

let renderer;

let camera3D;

let clock;

let cakeGroup;

let candlesGroup;

let flamesGroup;

let starField;

let ambientParticles;

let floatingDecorations;

let candleLights = [];

let centerLight;


/* =========================================================
   FIREWORK ARRAY
   ========================================================= */

const fireworks = [];


/* =========================================================
   THREE INITIALIZATION
   ========================================================= */

function initializeThree() {

    scene =
        new THREE.Scene();


    scene.fog =
        new THREE.FogExp2(
            0x05020c,
            0.014
        );


    renderer =
        new THREE.WebGLRenderer({

            antialias: true,

            alpha: false

        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    renderer.outputEncoding =
        THREE.sRGBEncoding;


    sceneContainer.appendChild(
        renderer.domElement
    );


    camera3D =
        new THREE.PerspectiveCamera(

            45,

            window.innerWidth /
            window.innerHeight,

            .1,

            1000

        );


    camera3D.position.set(
        0,
        3.1,
        13
    );


    camera3D.lookAt(
        0,
        2.2,
        0
    );


    clock =
        new THREE.Clock();


    updateLoading(10);

}


/* =========================================================
   LIGHTING
   ========================================================= */

function createLighting() {

    const ambient =
        new THREE.AmbientLight(
            0x643c91,
            .65
        );

    scene.add(
        ambient
    );


    const directional =
        new THREE.DirectionalLight(
            0x9bb0ff,
            1.25
        );

    directional.position.set(
        -6,
        9,
        7
    );

    scene.add(
        directional
    );


    const pink =
        new THREE.PointLight(
            0xff249d,
            5,
            22
        );

    pink.position.set(
        -5,
        4,
        4
    );

    scene.add(
        pink
    );


    const blue =
        new THREE.PointLight(
            0x526dff,
            5,
            22
        );

    blue.position.set(
        5,
        4,
        3
    );

    scene.add(
        blue
    );


    centerLight =
        new THREE.PointLight(
            0xff922e,
            3,
            14
        );

    centerLight.position.set(
        0,
        5,
        4
    );

    scene.add(
        centerLight
    );


    updateLoading(18);

}


/* =========================================================
   CAKE MATERIAL
   ========================================================= */

function cakeMaterial(
    color
) {

    return new THREE.MeshStandardMaterial({

        color,

        roughness: .3,

        metalness: .04

    });

}


/* =========================================================
   CYLINDER
   ========================================================= */

function cylinder(
    radius,
    height,
    color
) {

    return new THREE.Mesh(

        new THREE.CylinderGeometry(
            radius,
            radius,
            height,
            64
        ),

        cakeMaterial(
            color
        )

    );

}


/* =========================================================
   CREATE CAKE
   ========================================================= */

function createCake() {

    cakeGroup =
        new THREE.Group();


    scene.add(
        cakeGroup
    );


    /*
     * Bottom layer
     */

    const bottom =
        cylinder(
            3.35,
            1.2,
            0xf0449b
        );

    bottom.position.y =
        .65;

    cakeGroup.add(
        bottom
    );


    /*
     * Bottom cream
     */

    const cream1 =
        cylinder(
            3.4,
            .22,
            0xffe9f5
        );

    cream1.position.y =
        1.22;

    cakeGroup.add(
        cream1
    );


    /*
     * Middle layer
     */

    const middle =
        cylinder(
            2.75,
            1.15,
            0xff76bc
        );

    middle.position.y =
        1.82;

    cakeGroup.add(
        middle
    );


    /*
     * Middle cream
     */

    const cream2 =
        cylinder(
            2.81,
            .23,
            0xffffff
        );

    cream2.position.y =
        2.36;

    cakeGroup.add(
        cream2
    );


    /*
     * Upper layer
     */

    const upper =
        cylinder(
            2.2,
            1.05,
            0xffa4d3
        );

    upper.position.y =
        2.88;

    cakeGroup.add(
        upper
    );


    /*
     * Top cream
     */

    const cream3 =
        cylinder(
            2.27,
            .25,
            0xfffbff
        );

    cream3.position.y =
        3.40;

    cakeGroup.add(
        cream3
    );


    createCreamDrops();

    createSprinkles();

    createFruit();

    createCandles();

    createTopDecoration();


    updateLoading(35);

}


/* =========================================================
   CREAM DROPS
   ========================================================= */

function createCreamDrops() {

    const material =
        new THREE.MeshStandardMaterial({

            color: 0xffffff,

            roughness: .2

        });


    for (
        let i = 0;
        i < 28;
        i++
    ) {

        const angle =
            i /
            28 *
            Math.PI *
            2;


        const radius =
            2.24;


        const drop =
            new THREE.Mesh(

                new THREE.SphereGeometry(
                    .15,
                    18,
                    18
                ),

                material

            );


        drop.position.set(

            Math.cos(angle) *
                radius,

            3.22,

            Math.sin(angle) *
                radius

        );


        drop.scale.y =
            .8 +
            Math.random() *
            1.4;


        cakeGroup.add(
            drop
        );

    }

}


/* =========================================================
   SPRINKLES
   ========================================================= */

function createSprinkles() {

    const colors = [

        0xff3ca8,
        0xffd43f,
        0x4ddcff,
        0x9661ff,
        0xffffff

    ];


    for (
        let i = 0;
        i < 100;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI *
            2;


        const radius =
            1.1 +
            Math.random() *
            1.0;


        const color =
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];


        const sprinkle =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    .035,
                    .12,
                    .035
                ),

                new THREE.MeshStandardMaterial({

                    color,

                    emissive:
                        color,

                    emissiveIntensity:
                        .35

                })

            );


        sprinkle.position.set(

            Math.cos(angle) *
                radius,

            3.56,

            Math.sin(angle) *
                radius

        );


        sprinkle.rotation.z =
            Math.random() *
            Math.PI;


        sprinkle.rotation.y =
            Math.random() *
            Math.PI;


        cakeGroup.add(
            sprinkle
        );

    }

}


/* =========================================================
   FRUIT
   ========================================================= */

function createFruit() {

    const colors = [

        0xff174f,
        0xffd447,
        0x5cff83,
        0xff64c9

    ];


    for (
        let i = 0;
        i < 18;
        i++
    ) {

        const angle =
            i /
            18 *
            Math.PI *
            2;


        const radius =
            1.7;


        const color =
            colors[
                i %
                colors.length
            ];


        const fruit =
            new THREE.Mesh(

                new THREE.SphereGeometry(
                    .17,
                    20,
                    20
                ),

                new THREE.MeshStandardMaterial({

                    color,

                    roughness: .18

                })

            );


        fruit.position.set(

   ========================================================= */

function createFirework(
    x,
    y,
    z
) {

    if (
        fireworks.length >=
        CONFIG.maximumFireworks
    ) {

        return;

    }


    const group =
        new THREE.Group();


    scene.add(
        group
    );


    const colors = [

        0xff3da9,
        0x4ddcff,
        0xffd447,
        0x9661ff,
        0xffffff,
        0x59ff9b

    ];


    const mainColor =
        colors[
            Math.floor(
                Math.random() *
                colors.length
            )
        ];


    const particles = [];


    for (
        let i = 0;
        i < 135;
        i++
    ) {

        const theta =
            Math.random() *
            Math.PI *
            2;


        const phi =
            Math.acos(
                2 *
                Math.random() -
                1
            );


        const speed =
            1.2 +
            Math.random() *
            3.3;


        const particle =
            new THREE.Mesh(

                new THREE.SphereGeometry(
                    .03 +
                    Math.random() *
                    .045,
                    7,
                    7
                ),

                new THREE.MeshBasicMaterial({

                    color:
                        Math.random() >
                        .15
                            ? mainColor
                            : 0xffffff

                })

            );


        particle.position.set(
            x,
            y,
            z
        );


        group.add(
            particle
        );


        particles.push({

            mesh: particle,

            vx:
                Math.sin(phi) *
                Math.cos(theta) *
                speed,

            vy:
                Math.cos(phi) *
                speed,

            vz:
                Math.sin(phi) *
                Math.sin(theta) *
                speed,

            life: 1,

            decay:
                .006 +
                Math.random() *
                .008

        });

    }


    fireworks.push({

        group,

        particles,

        age: 0

    });

}

/* =========================================================
   UPDATE FIREWORKS
   ========================================================= */

function updateFireworks() {

    for (
        let i =
            fireworks.length - 1;

        i >= 0;

        i--
    ) {

        const firework =
            fireworks[i];


        firework.age +=
            .016;


        for (
            const particle
            of firework.particles
        ) {

            particle.mesh.position.x +=
                particle.vx *
                .035;


            particle.mesh.position.y +=
                particle.vy *
                .035;


            particle.mesh.position.z +=
                particle.vz *
                .035;


            particle.vy -=
                .017;


            particle.vx *=
                .993;


            particle.vy *=
                .993;


            particle.vz *=
                .993;


            particle.life -=
                particle.decay;


            particle.mesh.scale.setScalar(

                Math.max(
                    particle.life,
                    0
                )

            );

        }


        if (
            firework.age >
            2.3
        ) {

            scene.remove(
                firework.group
            );


            fireworks.splice(
                i,
                1
            );

        }

    }

}

/* =========================================================
   AUDIO INIT
   ========================================================= */

function initializeAudio() {

    if (
        audioContext
    ) {

        return;

    }


    const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;


    if (
        !AudioContextClass
    ) {

        setStatus(
            "Audio not supported"
        );

        return;

    }


    audioContext =
        new AudioContextClass();


    masterGain =
        audioContext.createGain();


    masterGain.gain.value =
        .07;


    masterGain.connect(
        audioContext.destination
    );

}


/* =========================================================
   PLAY NOTE
   ========================================================= */

function playNote(
    frequency,
    duration
) {

    if (
        !audioContext ||
        !masterGain
    ) {

        return;

    }


    const oscillator =
        audioContext.createOscillator();


    const gain =
        audioContext.createGain();


    oscillator.type =
        "sine";


    oscillator.frequency.value =
        frequency;


    const now =
        audioContext.currentTime;


    gain.gain.setValueAtTime(
        .0001,
        now
    );


    gain.gain.exponentialRampToValueAtTime(
        .45,
        now + .035
    );


    gain.gain.exponentialRampToValueAtTime(
        .0001,
        now +
        duration
    );


    oscillator.connect(
        gain
    );


    gain.connect(
        masterGain
    );


    oscillator.start(
        now
    );


    oscillator.stop(
        now +
        duration +
        .05
    );

}


/* =========================================================
   CONTINUOUS MUSIC
   ========================================================= */

function playMusicLoop() {

    if (
        !state.musicEnabled ||
        !state.musicStarted
    ) {

        return;

    }


    if (
        !audioContext
    ) {

        return;

    }


    const note =
        melody[musicIndex];


    playNote(
        note[0],
        note[1] * .9
    );


    musicIndex =
        (
            musicIndex + 1
        ) %
        melody.length;


    musicTimer =
        setTimeout(
            playMusicLoop,
            note[1] * 1000
        );

}


/* =========================================================
   START MUSIC
   ========================================================= */

function startMusic() {

    initializeAudio();


    if (
        !audioContext
    ) {

        return;

    }


    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();

    }


    if (
        state.musicStarted
    ) {

        return;

    }


    state.musicStarted =
        true;


    partyMessage.textContent =
        "🎵 HAPPY BIRTHDAY 🎵";


    setStatus(
        "🎵 Happy Birthday is playing"
    );


    playMusicLoop();

}


/* =========================================================
   STOP MUSIC
   ========================================================= */

function stopMusic() {

    state.musicStarted =
        false;


    if (
        musicTimer
    ) {

        clearTimeout(
            musicTimer
        );

        musicTimer =
            null;

    }

}


/* =========================================================
   AUDIO UNLOCK
   ========================================================= */

function unlockAudio() {

    initializeAudio();


    if (
        audioContext &&
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();

    }


    startMusic();

}

/* =========================================================
   MEDIAPIPE
   ========================================================= */

let handsDetector =
    null;

let processingHands =
    false;


/* =========================================================
   INITIALIZE HANDS
   ========================================================= */

function initializeHands() {

    if (
        typeof Hands ===
        "undefined"
    ) {

        setStatus(
            "Hand tracking failed"
        );

        return;

    }


    handsDetector =
        new Hands({

            locateFile:
                file =>

                    "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" +
                    file

        });


    handsDetector.setOptions({

        maxNumHands: 1,

        modelComplexity: 1,

        minDetectionConfidence: .65,

        minTrackingConfidence: .65

    });


    handsDetector.onResults(
        handleHandResults
    );


    state.handsReady =
        true;


    updateLoading(88);

}


/* =========================================================
   PROCESS CAMERA
   ========================================================= */

async function processCameraFrame() {

    if (
        !handsDetector ||
        !state.cameraReady
    ) {

        requestAnimationFrame(
            processCameraFrame
        );

        return;

    }


    if (
        processingHands
    ) {

        requestAnimationFrame(
            processCameraFrame
        );

        return;

    }


    processingHands =
        true;


    try {

        await handsDetector.send({

            image:
                cameraPreview

        });

    }

    catch (
        error
    ) {

        console.warn(
            "Hand tracking:",
            error
        );

    }


    processingHands =
        false;


    requestAnimationFrame(
        processCameraFrame
    );

}


/* =========================================================
   HAND RESULTS
   ========================================================= */

function handleHandResults(
    results
) {

    handContext.clearRect(
        0,
        0,
        handCanvas.width,
        handCanvas.height
    );


    if (
        results.multiHandLandmarks &&
        results.multiHandLandmarks.length
    ) {

        const landmarks =
            results.multiHandLandmarks[0];


        drawHand(
            landmarks
        );


        const gesture =
            recognizeGesture(
                landmarks
            );


        if (
            gesture !== "none"
        ) {

            processGesture(
                gesture
            );

        }

    }

    else {

        setStatus(
            "Show your hand..."
        );

    }

}


/* =========================================================
   DRAW HAND
   ========================================================= */

function drawHand(
    landmarks
) {

    if (
        typeof drawConnectors ===
        "undefined"
    ) {

        return;

    }


    drawConnectors(

        handContext,

        landmarks,

        HAND_CONNECTIONS,

        {

            color: "#ff6fd0",

            lineWidth: 3

        }

    );


    drawLandmarks(

        handContext,

        landmarks,

        {

            color: "#ffffff",

            lineWidth: 1,

            radius: 4

        }

    );

}


/* =========================================================
   DISTANCE
   ========================================================= */

function distance(
    a,
    b
) {

    const dx =
        a.x - b.x;

    const dy =
        a.y - b.y;

    const dz =
        a.z - b.z;

    return Math.sqrt(
        dx * dx +
        dy * dy +
        dz * dz
    );

}


/* =========================================================
   FINGER EXTENDED
   ========================================================= */

function fingerExtended(
    landmarks,
    tip,
    pip
) {

    return (
        landmarks[tip].y <
        landmarks[pip].y
    );

}


/* =========================================================
   GESTURE RECOGNITION
   ========================================================= */

function recognizeGesture(
    landmarks
) {

    if (
        !landmarks ||
        landmarks.length < 21
    ) {

        return "none";

    }


    const index =
        fingerExtended(
            landmarks,
            8,
            6
        );


    const middle =
        fingerExtended(
            landmarks,
            12,
            10
        );


    const ring =
        fingerExtended(
            landmarks,
            16,
            14
        );


    const pinky =
        fingerExtended(
            landmarks,
            20,
            18
        );


    const thumb =
        distance(
            landmarks[4],
            landmarks[5]
        ) > .12;


    /*
     * Peace
     */

    if (
        index &&
        middle &&
        !ring &&
        !pinky
    ) {

        return "peace";

    }


    /*
     * Point
     */

    if (
        index &&
        !middle &&
        !ring &&
        !pinky
    ) {

        return "point";

    }


    /*
     * Open hand
     */

    if (
        index &&
        middle &&
        ring &&
        pinky
    ) {

        return "open";

    }


    /*
     * Like
     */

    if (
        thumb &&
        !index &&
        !middle &&
        !ring &&
        !pinky
    ) {

        return "like";

    }


    /*
     * Fist
     */

    if (
        !index &&
        !middle &&
        !ring &&
        !pinky
    ) {

        return "fist";

    }


    return "none";

}


/* =========================================================
   GESTURE PROCESSING
   ========================================================= */

function processGesture(
    gesture
) {

    const now =
        Date.now();


    if (
        gesture ===
        state.currentGesture &&
        now -
        state.lastGestureTime <
        CONFIG.gestureCooldown
    ) {

        return;

    }


    state.currentGesture =
        gesture;


    state.lastGestureTime =
        now;


    switch (
        gesture
    ) {

        case "open":
            gestureOpen();
            break;

        case "fist":
            gestureFist();
            break;

        case "point":
            gesturePoint();
            break;

        case "peace":
            gesturePeace();
            break;

        case "like":
            gestureLike();
            break;

    }

}


/* =========================================================
   OPEN HAND
   ========================================================= */

function gestureOpen() {

    state.partyRunning =
        true;

    state.fireworksEnabled =
        true;

    state.musicEnabled =
        true;


    setStatus(
        "🖐 PARTY ON!"
    );


    startMusic();


    randomFirework();

    randomFirework();

}


/* =========================================================
   FIST
   ========================================================= */

function gestureFist() {

    state.partyRunning =
        false;

    state.fireworksEnabled =
        false;


    stopMusic();


    setStatus(
        "✊ PARTY PAUSED"
    );


    partyMessage.textContent =
        "PARTY PAUSED — OPEN YOUR HAND TO CONTINUE";

}


/* =========================================================
   POINT
   ========================================================= */

function gesturePoint() {

    state.partyRunning =
        true;

    state.candlesEnabled =
        true;


    setStatus(
        "☝ CANDLES GLOWING!"
    );


    partyMessage.textContent =
        "🕯️ MAKE A WISH!";


    candleBurst();

}


/* =========================================================
   PEACE
   ========================================================= */

function gesturePeace() {

    state.partyRunning =
        true;

    state.fireworksEnabled =
        true;

    state.musicEnabled =
        true;


    setStatus(
        "✌ CELEBRATE PARTY!"
    );


    startMusic();


    partyMessage.textContent =
        "🎆 CELEBRATE PARTY! 🎆";


    for (
        let i = 0;
        i < 9;
        i++
    ) {

        setTimeout(

            () => {

                if (
                    state.partyRunning
                ) {

                    randomFirework();

                }

            },

            i * 220

        );

    }

}


/* =========================================================
   LIKE
   ========================================================= */

function gestureLike() {

    state.partyRunning =
        true;

    state.musicEnabled =
        true;


    startMusic();


    randomFirework();


    setStatus(
        "👍 HAPPY BIRTHDAY!"
    );


    partyMessage.textContent =
        "🎂 HAPPY BIRTHDAY! 🎂";

}


/* =========================================================
   CANDLE BURST
   ========================================================= */

const candleParticles = [];


function candleBurst() {

    for (
        let i = 0;
        i < 45;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI *
            2;


        const particle =
            new THREE.Mesh(

                new THREE.SphereGeometry(
                    .025,
                    8,
                    8
                ),

                new THREE.MeshBasicMaterial({

                    color:
                        Math.random() >
                        .5
                            ? 0xffd85b
                            : 0xffffff

                })

            );


        particle.position.set(

            (
                Math.random() -
                .5
            ) * 2,

            4,

            (
                Math.random() -
                .5
            ) * 2

        );


        scene.add(
            particle
        );


        candleParticles.push({

            mesh:
                particle,

            life: 1,

            vx:
                Math.cos(angle) *
                (
                    .02 +
                    Math.random() *
                    .05
                ),

            vy:
                .03 +
                Math.random() *
                .07,

            vz:
                Math.sin(angle) *
                (
                    .02 +
                    Math.random() *
                    .05
                )

        });

    }

}


/* =========================================================
   UPDATE CANDLE PARTICLES
   ========================================================= */

function updateCandleParticles() {

    for (
        let i =
            candleParticles.length - 1;

        i >= 0;

        i--
    ) {

        const particle =
            candleParticles[i];


        particle.mesh.position.x +=
            particle.vx;


        particle.mesh.position.y +=
            particle.vy;


        particle.mesh.position.z +=
            particle.vz;


        particle.vy -=
            .001;


        particle.life -=
            .018;


        particle.mesh.scale.setScalar(
            Math.max(
                particle.life,
                0
            )
        );


        if (
            particle.life <= 0
        ) {

            scene.remove(
                particle.mesh
            );


            candleParticles.splice(
                i,
                1
            );

        }

    }

}


/* =========================================================
   KEYBOARD
   ========================================================= */

function setupKeyboard() {

    document.addEventListener(
        "keydown",
        event => {

            switch (
                event.key
            ) {

                case "1":
                    processGesture("open");
                    break;

                case "2":
                    processGesture("fist");
                    break;

                case "3":
                    processGesture("point");
                    break;

                case "4":
                    processGesture("peace");
                    break;

                case "5":
                    processGesture("like");
                    break;

                case " ":

                    if (
                        state.partyRunning
                    ) {

                        gestureFist();

                    }

                    else {

                        state.partyRunning =
                            true;

                        state.fireworksEnabled =
                            true;

                        state.musicEnabled =
                            true;

                        startMusic();

                        setStatus(
                            "PARTY RESUMED"
                        );

                        partyMessage.textContent =
                            "🎉 PARTY RESUMED 🎉";

                    }

                    break;

            }

        }
    );

}


/* =========================================================
   POINTER / TOUCH
   ========================================================= */

function setupPointerControls() {

    let audioUnlocked =
        false;


    const firstInteraction =
        () => {

            if (
                !audioUnlocked
            ) {

                audioUnlocked =
                    true;

                unlockAudio();

                partyMessage.textContent =
                    "🎵 HAPPY BIRTHDAY IS PLAYING";

            }

        };


    document.addEventListener(
        "pointerdown",
        firstInteraction,
        {
            passive: true
        }
    );


    /*
     * Every click also creates fireworks.
     */

    document.addEventListener(
        "click",
        event => {

            /*
             * Ignore clicks on camera area.
             */

            if (
                event.target ===
                cameraPreview
            ) {

                return;

            }


            if (
                state.partyRunning
            ) {

                randomFirework();

            }

        }
    );

}


/* =========================================================
   INITIAL FIREWORKS
   ========================================================= */

function initialFireworks() {

    setTimeout(
        () => {

            randomFirework();

        },
        900
    );


    setTimeout(
        () => {

            randomFirework();

        },
        1450
    );


    setTimeout(
        () => {

            randomFirework();

        },
        2000
    );


    setTimeout(
        () => {

            randomFirework();

        },
        2700
    );


    setTimeout(
        () => {

            randomFirework();

        },
        3400
    );

}


/* =========================================================
   RESIZE
   ========================================================= */

function handleResize() {

    if (
        !renderer ||
        !camera3D
    ) {

        return;

    }


    camera3D.aspect =
        window.innerWidth /
        window.innerHeight;


    camera3D.updateProjectionMatrix();


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}


/* =========================================================
   ANIMATION
   ========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    const elapsed =
        clock.getElapsedTime();


    updateCake(
        elapsed
    );


    updateFlames(
        elapsed
    );


    updateStars(
        elapsed
    );


    updateAmbient(
        elapsed
    );


    updateFloatingDecorations(
        elapsed
    );


    updateFireworks();


    updateCandleParticles();


    renderer.render(
        scene,
        camera3D
    );

}


/* =========================================================
   INITIALIZE PARTY
   ========================================================= */

async function initializeParty() {

    try {

        updateLoading(3);


        /*
         * THREE
         */

        initializeThree();


        /*
         * LIGHTING
         */

        createLighting();


        /*
         * CAKE
         */

        createCake();


        /*
         * STARS
         */

        createStars();


        /*
         * PARTICLES
         */

        createAmbientParticles();


        createFloatingDecorations();


        updateLoading(60);


        /*
         * HANDS
         */

        initializeHands();


        /*
         * CAMERA
         */

        await startCamera();


        /*
         * CONTROLS
         */

        setupKeyboard();

        setupPointerControls();


        /*
         * FIREWORKS
         */

        startAutomaticFireworks();

        initialFireworks();


        /*
         * ANIMATION
         */

        animate();


        /*
         * HAND PROCESSING
         */

        processCameraFrame();


        /*
         * COMPLETE
         */

        updateLoading(100);


        setStatus(
            "Ready — tap once, then show your hand"
        );


        /*
         * Hide loading
         */

        setTimeout(
            () => {

                loadingScreen.style.opacity =
                    "0";


                setTimeout(
                    () => {

                        loadingScreen.style.display =
                            "none";

                    },
                    1000
                );

            },
            800
        );

    }

    catch (
        error
    ) {

        console.error(
            "Initialization error:",
            error
        );


        setStatus(
            "Initialization error — press F12"
        );

    }

}


/* =========================================================
   EVENTS
   ========================================================= */

window.addEventListener(
    "resize",
    handleResize
);


/* =========================================================
   START
   ========================================================= */

initializeParty();

</script>
